<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeJAVU — Opportunity Creation Flow</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Work+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --boundless-blue: #285F74;
            --resilient-turquoise: #00A0AF;
            --gritty-green: #BBD153;
            --optimistic-ice: #C2EDF0;
            --immersive-blue-black: #22404D;
            --off-white: #EEF3F4;
            --pure-white: #FFFFFF;
            --danger-red: #D9534F;
            --sidebar-w: 400px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--off-white);
            color: var(--immersive-blue-black);
            margin: 0;
            overflow-x: hidden;
        }

        h1, h2, h3, h4 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        /* ── Header ── */
        header {
            background: var(--immersive-blue-black);
            color: var(--pure-white);
            padding: 16px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 4px solid var(--resilient-turquoise);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .header-left { display: flex; align-items: center; gap: 12px; }
        header h1 { margin: 0; font-size: 1.15rem; }
        header h1 span { color: var(--resilient-turquoise); }

        .hint-pill {
            font-size: 0.72rem;
            font-weight: 600;
            background: rgba(0, 160, 175, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            color: var(--optimistic-ice);
        }

        /* ── Main canvas ── */
        .canvas {
            padding: 28px 20px 80px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .diagram-block {
            background: var(--pure-white);
            border-radius: 24px;
            margin-bottom: 32px;
            box-shadow: 0 8px 32px rgba(34, 64, 77, 0.08);
            overflow: hidden;
            position: relative;
            padding-top: 36px;
        }

        .diagram-block::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--resilient-turquoise), var(--gritty-green));
        }

        .block-tag {
            position: absolute;
            top: 14px;
            left: 20px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            color: var(--resilient-turquoise);
            z-index: 2;
        }

        .diagram-svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Clickable nodes */
        .click-node {
            cursor: pointer;
            transition: filter 0.2s, transform 0.2s;
        }

        .click-node:hover {
            filter: brightness(1.06) drop-shadow(0 4px 12px rgba(0, 160, 175, 0.35));
        }

        .click-node.active {
            filter: drop-shadow(0 0 0 3px var(--resilient-turquoise)) brightness(1.04);
        }

        .click-node .node-hint {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .click-node:hover .node-hint {
            opacity: 1;
        }

        /* ── Sidebar ── */
        .sidebar-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(34, 64, 77, 0.45);
            backdrop-filter: blur(3px);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .sidebar-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: var(--sidebar-w);
            max-width: 92vw;
            height: 100vh;
            background: var(--pure-white);
            z-index: 201;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            box-shadow: -8px 0 40px rgba(34, 64, 77, 0.15);
        }

        .sidebar.open {
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 24px 24px 16px;
            border-bottom: 1px solid var(--optimistic-ice);
            position: relative;
            flex-shrink: 0;
        }

        .sidebar-phase {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--resilient-turquoise);
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .sidebar-title {
            margin: 0;
            font-size: 1.2rem;
            padding-right: 36px;
        }

        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 18px;
            width: 36px;
            height: 36px;
            border: none;
            background: var(--off-white);
            border-radius: 50%;
            font-size: 1.3rem;
            line-height: 1;
            cursor: pointer;
            color: var(--immersive-blue-black);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, color 0.2s;
        }

        .sidebar-close:hover {
            background: var(--danger-red);
            color: white;
        }

        .sidebar-body {
            padding: 20px 24px 32px;
            overflow-y: auto;
            flex-grow: 1;
            font-size: 0.92rem;
            line-height: 1.6;
            color: #445;
        }

        .sidebar-body p { margin: 0 0 14px; }

        .detail-list {
            list-style: none;
            margin: 0 0 16px;
            padding: 0;
        }

        .detail-list li {
            padding: 10px 14px;
            background: var(--off-white);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.88rem;
        }

        .detail-list li strong {
            display: block;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.82rem;
            color: var(--immersive-blue-black);
            margin-bottom: 2px;
        }

        .detail-list li span {
            font-size: 0.8rem;
            color: #667;
        }

        .roc-tag {
            display: inline-block;
            font-size: 0.65rem;
            font-weight: 700;
            background: rgba(40, 95, 116, 0.12);
            color: var(--boundless-blue);
            padding: 2px 7px;
            border-radius: 3px;
            border: 1px dashed var(--boundless-blue);
            margin-left: 6px;
            vertical-align: middle;
        }

        .flow-steps {
            counter-reset: step;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .flow-steps li {
            counter-increment: step;
            padding: 12px 12px 12px 44px;
            position: relative;
            margin-bottom: 10px;
            background: var(--off-white);
            border-radius: 10px;
            border-left: 3px solid var(--resilient-turquoise);
        }

        .flow-steps li::before {
            content: counter(step);
            position: absolute;
            left: 12px;
            top: 12px;
            width: 22px;
            height: 22px;
            background: var(--resilient-turquoise);
            color: white;
            border-radius: 50%;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 0.7rem;
            text-align: center;
            line-height: 22px;
        }

        .status-pill {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 4px;
            margin-top: 6px;
        }

        .status-pill.pass { background: rgba(187, 209, 83, 0.3); color: #4a5a10; }
        .status-pill.fail { background: rgba(217, 83, 79, 0.15); color: var(--danger-red); }
        .status-pill.pending { background: var(--optimistic-ice); color: var(--boundless-blue); }

        .formula-box {
            background: var(--immersive-blue-black);
            color: white;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.88rem;
            margin: 14px 0;
        }

        .formula-box em {
            color: var(--resilient-turquoise);
            font-style: normal;
            font-weight: 800;
        }

        .pill-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0 14px;
        }

        .pill {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background: white;
            border: 1px solid var(--optimistic-ice);
        }

        @media (max-width: 600px) {
            .hint-pill { display: none; }
            header h1 { font-size: 1rem; }
        }
    </style>
</head>

                <p><strong>Any failed?</strong> → Block opportunity visibility/application. Volunteer redirected to complete missing credentials.</p>`
            },
            'gate-onboard': {
                phase: 'Phase 2 · Gate 1',
                title: 'Onboarding Completed',
                body: `<p>Verification that the volunteer has completed the basic DeJAVU general orientation checklist.</p>
                <p>This is the foundational gate — typically required for all opportunities. Without it, the volunteer cannot proceed to application regardless of other credentials.</p>`
            },
            'gate-safeguard': {
                phase: 'Phase 2 · Gate 2',
                title: 'Child Safeguarding Cleared',
                body: `<p>Required for any opportunity involving youth interaction (e.g., Company Program Business Advisor roles).</p>
                <p>Requires:</p>
                <ul class="detail-list">
                    <li><strong>Policy sign-off</strong><span>Volunteer has acknowledged and signed the child safeguarding policy.</span></li>
                    <li><strong>Risk review</strong><span>Background and risk assessment completed by admin.</span></li>
                </ul>`
            },
            'gate-quiz': {
                phase: 'Phase 2 · Gate 3',
                title: 'Domain-Specific Quiz Passed',
                body: `<p>Skill validation check tied to the opportunity's Global Category. Examples:</p>
                <div class="pill-row">
                    <span class="pill">Financial Literacy Quiz</span>
                    <span class="pill">Entrepreneurship Quiz</span>
                    <span class="pill">Work Readiness Quiz</span>
                </div>
                <p>Quiz scores are to be verified by the team before the qualification badge is issued.</p>`
            },
            routing: {
                phase: 'Phase 3',
                title: 'Acceptance Pathway Routing',
                body: `<p>Once a volunteer passes all active qualification gates and applies, their record is routed through one of two configured acceptance pathways.</p>
                <ul class="detail-list">
                    <li><strong>Pathway 1 — Manual ROC/Staff Review</strong><span>Phase 1 baseline. Admin manually verifies profile and assigns.</span></li>
                    <li><strong>Pathway 2 — Auto-Assign</strong><span>Self-scheduling. Bypasses admin queue when all qualifications are verified.</span></li>
                </ul>
                <p>Click each pathway diagram for step-by-step detail.</p>`
            },
            'pathway-manual': {
                phase: 'Phase 3 · Pathway 1',
                title: 'Manual ROC/Staff Review',
                body: `<ol class="flow-steps">
                    <li>Volunteer registers/applies for the opportunity.</li>
                    <li>Status set to <span class="status-pill pending">Pending Review (In-Process)</span></li>
                    <li>System triggers alert to Spoke/ROC Admin.</li>
                    <li>Admin manually verifies profile completeness and clicks Accept/Assign.</li>
                    <li>Status changes to <span class="status-pill pass">Scheduled</span></li>
                </ol>
                <p>This is the Phase 1 baseline pathway. Used when human verification is required before assignment.</p>`
            },
            'pathway-auto': {
                phase: 'Phase 3 · Pathway 2',
                title: 'Auto-Assign (Self-Scheduling)',
                body: `<ol class="flow-steps">
                    <li>Volunteer clicks Sign Up for an open opportunity shift.</li>
                    <li>System evaluates the volunteer's active qualification badges.</li>
                    <li>If <strong>all</strong> required qualifications are True → status instantly changes to <span class="status-pill pass">Scheduled</span>. Admin queue bypassed.</li>
                    <li>If <strong>any</strong> qualification is False → registration blocked. Volunteer redirected to complete missing credentials.</li>
                </ol>`
            },
            scheduled: {
                phase: 'Phase 4',
                title: 'Scheduled — Volunteer Assigned',
                body: `<p>Volunteer has been successfully assigned to the opportunity, either via manual admin approval or auto-assign.</p>
                <p>At this stage the volunteer is active on the opportunity and can proceed to deliver sessions and log hours.</p>`
            },
            delivery: {
                phase: 'Phase 4',
                title: 'Delivery & Hour Logging',
                body: `<p>After assignment, offline delivery sessions are conducted and hours are recorded in Better Impact.</p>
                <ol class="flow-steps">
                    <li>Sessions delivered in the field or online.</li>
                    <li>Volunteer logs hours against the opportunity.</li>
                    <li>Admin or M&amp;E team reviews and approves logged hours.</li>
                    <li>Approved hours feed into the completion % calculation.</li>
                </ol>`
            },
            merl: {
                phase: 'Phase 5',
                title: 'M&E Participation Validation',
                body: `<p>After delivery, the system evaluates volunteer success using the MERL team's 80% completion rule.</p>
                <div class="formula-box">Completion % = <em>(Approved Hours ÷ Committed Hours) × 100</em></div>
                <p>Committed Hours are set at opportunity creation (Phase 1). Approved Hours are the total hours approved by admin/M&amp;E after delivery.</p>
                <p>Click the outcome nodes in the diagram for pass/fail details.</p>`
            },
            'merl-success': {
                phase: 'Phase 5 · Scenario A',
                title: 'Successful Participant (≥ 80%)',
                body: `<p><strong>Condition:</strong> Completion % is 80% or greater.</p>
                <p><strong>Outcome:</strong> Volunteer status for this opportunity is marked as <span class="status-pill pass">Successful Participant</span>.</p>
                <p><strong>Trigger:</strong> Valid Participation.</p>`
            },
            'merl-incomplete': {
                phase: 'Phase 5 · Scenario B',
                title: 'Incomplete Participation (< 80%)',
                body: `<p><strong>Condition:</strong> Completion % is below 80%.</p>
                <p><strong>Outcome:</strong> Volunteer status is marked as <span class="status-pill fail">Incomplete Participation</span>.</p>
                <p><strong>Trigger:</strong> Flagged as incomplete</p>`
            },
            blocked: {
                phase: 'Gate Failure',
                title: 'Access Blocked',
                body: `<p>When a volunteer fails one or more active qualification gates, the system:</p>
                <ul class="detail-list">
                    <li><strong>Blocks</strong><span>Opportunity visibility and application/self-schedule access.</span></li>
                    <li><strong>Redirects</strong><span>Volunteer to complete missing credentials (onboarding, safeguarding, or domain quiz).</span></li>
                </ul>
                <p>Registration cannot proceed until all active gates return True.</p>`
            },
            certificate: {
                phase: 'Outcome',
                title: 'Digital Certificate Eligibility',
                body: `<p>Regional digital certificates are generated only when a volunteer achieves <span class="status-pill pass">Successful Participant</span> status (≥ 80% completion).</p>
                <p>Volunteers with <span class="status-pill fail">Incomplete Participation</span> are flagged in reports and cannot receive a certificate for that opportunity.</p>`
            }
        };

        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('backdrop');
        const sbPhase = document.getElementById('sb-phase');
        const sbTitle = document.getElementById('sb-title');
        const sbBody = document.getElementById('sb-body');
        let activeNode = null;

        function openPanel(id, skipHighlight) {
            const data = panels[id];
            if (!data) return;

            if (!skipHighlight) {
                if (activeNode) activeNode.classList.remove('active');
                activeNode = document.querySelector(`[data-panel="${id}"]`);
                if (activeNode) activeNode.classList.add('active');
            }

            sbPhase.textContent = data.phase;
            sbTitle.textContent = data.title;
            sbBody.innerHTML = data.body;

            sidebar.classList.add('open');
            backdrop.classList.add('open');
            sidebar.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closePanel() {
            sidebar.classList.remove('open');
            backdrop.classList.remove('open');
            sidebar.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            if (activeNode) {
                activeNode.classList.remove('active');
                activeNode = null;
            }
        }

        document.querySelectorAll('.click-node').forEach(node => {
            node.addEventListener('click', e => {
                e.stopPropagation();
                if (activeNode) activeNode.classList.remove('active');
                activeNode = e.currentTarget;
                activeNode.classList.add('active');
                openPanel(node.dataset.panel, true);
            });
        });

        document.getElementById('sidebar-close').addEventListener('click', closePanel);
        backdrop.addEventListener('click', closePanel);
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closePanel();
        });
    </script>

</body>

</html>
