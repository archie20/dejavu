<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeJAVU — Project Index</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Work+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --boundless-blue: #285F74;
            --resilient-turquoise: #00A0AF;
            --gritty-green: #BBD153;
            --optimistic-ice: #C2EDF0;
            --immersive-blue-black: #22404D;
            --off-white: #EEF3F4;
            --pure-white: #FFFFFF;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Work Sans', sans-serif;
            background: var(--off-white);
            color: var(--immersive-blue-black);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        header {
            background: var(--immersive-blue-black);
            color: var(--pure-white);
            padding: 20px 32px;
            border-bottom: 4px solid var(--resilient-turquoise);
        }

        .header-inner {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        header h1 {
            margin: 0;
            font-size: 1.25rem;
        }

        header h1 span {
            color: var(--resilient-turquoise);
        }

        main {
            flex-grow: 1;
            max-width: 720px;
            margin: 0 auto;
            padding: 48px 24px 64px;
            width: 100%;
        }

        .intro {
            margin-bottom: 36px;
        }

        .intro h2 {
            margin: 0 0 8px;
            font-size: 1.5rem;
        }

        .intro p {
            margin: 0;
            color: #556;
            line-height: 1.6;
        }

        .link-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: block;
            background: var(--pure-white);
            border-radius: 16px;
            padding: 22px 24px;
            text-decoration: none;
            color: inherit;
            border: 2px solid var(--optimistic-ice);
            box-shadow: 0 4px 20px rgba(34, 64, 77, 0.06);
            transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--resilient-turquoise), var(--gritty-green));
        }

        .link-card:hover {
            border-color: var(--resilient-turquoise);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0, 160, 175, 0.15);
        }

        .link-card h3 {
            margin: 0 0 6px;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            color: var(--immersive-blue-black);
        }

        .link-card p {
            margin: 0 0 10px;
            font-size: 0.9rem;
            color: #667;
            line-height: 1.5;
        }

        .link-path {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--resilient-turquoise);
            font-family: 'Montserrat', sans-serif;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.72rem;
            color: #999;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">
            <svg width="36" height="36" viewBox="0 0 100 100" aria-hidden="true">
                <polygon points="50,5 95,50 50,95 5,50" fill="#00A0AF" />
                <polygon points="50,5 72.5,27.5 50,50 27.5,27.5" fill="#285F74" opacity="0.8" />
            </svg>
            <h1>DeJAVU <span>Project Index</span></h1>
        </div>
    </header>

    <main>
        <div class="intro">
            <h2>Working Diagrams</h2>
            <p>Visual process diagrams for Project DeJAVU — JA Africa Regional Volunteer Platform</p>
        </div>

        <ul class="link-list">
            <li>
                <a class="link-card" href="opportunity-create.html">
                    <h3>Opportunity Creation & Flow</h3>
                </a>
            </li>
        </ul>
    </main>

    <footer>
        Project DeJAVU · JA Africa Regional Volunteer Platform
    </footer>

</body>

</html>
